[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "empresia-scraper"
version = "0.1.0"
description = "Scrape Empresia.es Spanish company reports (CIF, CNAE, capital, sales band, officers, BORME announcements) and daily new incorporations with Python."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Buğrahan Saka" }]
keywords = ["empresia", "borme", "spain", "company data", "web scraping", "scraper", "cif", "cnae", "scrapedo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["requests>=2.25", "beautifulsoup4>=4.9"]

[project.urls]
Homepage = "https://github.com/bugrahansss/empresia-scraper"
Source = "https://github.com/bugrahansss/empresia-scraper"
Issues = "https://github.com/bugrahansss/empresia-scraper/issues"

[project.scripts]
empresia-scraper = "empresia_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
